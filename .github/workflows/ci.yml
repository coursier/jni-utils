name: CI
on:
  push:
    branches:
    - main
    tags:
    - "v*"
  pull_request:

jobs:
  checks:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/cache-action@v8
    - name: Empty sources, orphan sources, missing test classes checks
      run: ./mill -i --import io.github.alexarchambault.mill::mill-checks:0.1.2 io.github.alexarchambault.millchecks.MillChecks/allChecks
      env:
        MILL_CHECKS_ORPHAN_SOURCES_IGNORE: >-
          mill-build

  windows-arm64-native:
    name: Build Windows ARM64 native artifacts
    runs-on: windows-11-arm
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/cache-action@v8
    - name: Collect native artifacts
      run: ./mill -i ci.collectWindowsArm64NativeArtifacts --output-dir "${{ runner.temp }}/windows-arm64-native"
    - uses: actions/upload-artifact@v4
      with:
        name: windows-arm64-native
        path: ${{ runner.temp }}/windows-arm64-native

  package-local-m2:
    name: Package local Maven repo
    needs: windows-arm64-native
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/cache-action@v8
    - uses: actions/download-artifact@v4
      with:
        name: windows-arm64-native
        path: ${{ runner.temp }}/windows-arm64-native
    - name: Publish to temporary Maven repo
      env:
        JNI_UTILS_WINDOWS_ARM64_ARTIFACTS_DIR: ${{ runner.temp }}/windows-arm64-native
      run: >-
        ./mill -i ci.packageLocalM2
        --m-2-repo-path "${{ runner.temp }}/m2-repository"
        --output-zip "${{ runner.temp }}/jni-utils-m2-repository.zip"
    - uses: actions/upload-artifact@v4
      with:
        name: jni-utils-m2-repository
        path: ${{ runner.temp }}/jni-utils-m2-repository.zip

  test-published:
    name: Test published JAR (${{ matrix.runner }})
    needs: package-local-m2
    strategy:
      fail-fast: false
      matrix:
        runner:
        - windows-latest
        - windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/cache-action@v8
    - uses: actions/download-artifact@v4
      with:
        name: jni-utils-m2-repository
        path: ${{ runner.temp }}
    - name: Install local Maven repo
      run: >-
        ./mill -i ci.installLocalM2
        --input-zip "${{ runner.temp }}/jni-utils-m2-repository.zip"
        --m-2-repo-path "$HOME/.m2/repository"
    - name: Test published JAR
      run: ./mill -i windows-jni-utils-published-tests.test

  publish:
    if: github.event_name == 'push'
    needs: test-published
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/cache-action@v8
    - uses: actions/download-artifact@v4
      with:
        name: jni-utils-m2-repository
        path: ${{ runner.temp }}
    - name: Publish local Maven repo contents
      env:
        MILL_PGP_SECRET_BASE64: ${{ secrets.PUBLISH_SECRET_KEY }}
        MILL_PGP_PASSPHRASE: ${{ secrets.PUBLISH_SECRET_KEY_PASSWORD }}
        MILL_SONATYPE_USERNAME: ${{ secrets.PUBLISH_USER }}
        MILL_SONATYPE_PASSWORD: ${{ secrets.PUBLISH_PASSWORD }}
      run: ./mill -i ci.publishLocalM2Contents --input-zip "${{ runner.temp }}/jni-utils-m2-repository.zip"
