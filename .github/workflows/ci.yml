name: CI
on:
  push:
    branches:
    - main
    tags:
    - "v*"
  pull_request:

jobs:
  checks:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: coursier/cache-action@v9
    - name: Empty sources, orphan sources, missing test classes checks
      run: ./mill -i --import io.github.alexarchambault.mill::mill-checks:0.1.2 io.github.alexarchambault.millchecks.MillChecks/allChecks
      env:
        MILL_CHECKS_ORPHAN_SOURCES_IGNORE: >-
          mill-build

  test:
    name: Test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: ["windows-latest"]
        id: ["windows-x86-64"]
        include:
          - runner: windows-11-arm
            id: "windows-arm64"
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: coursier/cache-action@v9
    - name: Compile
      run: ./mill -i __.test.compile
    - name: Test
      run: ./mill -i __.test
    - name: Collect native artifacts
      run: ./mill -i ci.collectNativeArtifacts --output-dir "${{ runner.temp }}/${{ matrix.id }}-native"
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.id }}-native
        path: ${{ runner.temp }}/${{ matrix.id }}-native

  build-repo:
    name: Package local Maven repo
    needs: test
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: coursier/cache-action@v9
    - uses: actions/download-artifact@v8
      with:
        name: windows-arm64-native
        path: ${{ runner.temp }}/windows-arm64-native
    - uses: actions/download-artifact@v8
      with:
        name: windows-x86-64-native
        path: ${{ runner.temp }}/windows-x86-64-native
    - name: Publish to temporary Maven repo
      run: |
        ./mill -i show __.dll
        ./mill -i show __.cLib
        ./mill -i ci.packageLocalM2 --output "${{ runner.temp }}/m2-repo.zip"
      env:
        JNI_UTILS_WINDOWS_ARM64_ARTIFACTS_DIR: ${{ runner.temp }}/windows-arm64-native
        JNI_UTILS_WINDOWS_X86_64_ARTIFACTS_DIR: ${{ runner.temp }}/windows-x86-64-native
    - uses: actions/upload-artifact@v7
      with:
        name: m2-repo
        path: ${{ runner.temp }}/m2-repo.zip

  test-repo:
    name: Test published JAR (${{ matrix.runner }})
    needs: build-repo
    strategy:
      fail-fast: false
      matrix:
        runner:
        - windows-latest
        - windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: coursier/cache-action@v9
    - uses: actions/download-artifact@v8
      with:
        name: m2-repo
        path: ${{ runner.temp }}
    - name: Test published JAR
      run: |
        ./mill -i show windows-jni-utils-tests.test.runClasspath
        ./mill -i __.test
      env:
        REPO_ARCHIVE: "${{ runner.temp }}/m2-repo.zip"

  publish:
    if: github.event_name == 'push'
    needs: test-repo
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # for the GitHub Packages publishing below
      packages: write
    # Never run two jobs publishing to Sonatype Central at the same time (snapshots of successive
    # pushes, or a snapshot and a release). A job waits for the running one rather than cancelling it.
    concurrency:
      group: sonatype-central-publish-${{ github.repository }}
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: coursier/cache-action@v9
    - uses: actions/download-artifact@v8
      with:
        name: windows-arm64-native
        path: ${{ runner.temp }}/windows-arm64-native
    - uses: actions/download-artifact@v8
      with:
        name: windows-x86-64-native
        path: ${{ runner.temp }}/windows-x86-64-native
    - name: Publish
      shell: bash
      env:
        MILL_PGP_SECRET_BASE64: ${{ secrets.PUBLISH_SECRET_KEY }}
        MILL_PGP_PASSPHRASE: ${{ secrets.PUBLISH_SECRET_KEY_PASSWORD }}
        MILL_SONATYPE_USERNAME: ${{ secrets.PUBLISH_USER }}
        MILL_SONATYPE_PASSWORD: ${{ secrets.PUBLISH_PASSWORD }}
        JNI_UTILS_WINDOWS_ARM64_ARTIFACTS_DIR: ${{ runner.temp }}/windows-arm64-native
        JNI_UTILS_WINDOWS_X86_64_ARTIFACTS_DIR: ${{ runner.temp }}/windows-x86-64-native
      run: |
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          # --shouldRelease false: the bundle is uploaded and validated on Sonatype Central, but has
          # to be published manually from https://central.sonatype.com/publishing/deployments
          ./mill -i mill.scalalib.SonatypeCentralPublishModule/ --bundleName "coursier-jni-utils-${GITHUB_REF#refs/tags/v}" --shouldRelease false
        else
          for tag in $(git tag --points-at HEAD); do
            git tag -d "$tag"
          done
          ./mill -i mill.scalalib.SonatypeCentralPublishModule/
        fi
    # Same artifacts, snapshots included, to the GitHub Packages Maven repository of this repo.
    # Best effort: Sonatype Central is the source of truth.
    - name: Publish to GitHub Packages
      continue-on-error: true
      shell: bash
      run: |
        ./mill -i mill.javalib.MavenPublishModule/publishAll \
          --publishArtifacts "$PUBLISH_ARTIFACTS" \
          --releaseUri "https://maven.pkg.github.com/$GITHUB_REPOSITORY" \
          --snapshotUri "https://maven.pkg.github.com/$GITHUB_REPOSITORY"
      env:
        PUBLISH_ARTIFACTS: "__:PublishModule.publishArtifacts"
        MILL_MAVEN_USERNAME: ${{ github.actor }}
        MILL_MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        JNI_UTILS_WINDOWS_ARM64_ARTIFACTS_DIR: ${{ runner.temp }}/windows-arm64-native
        JNI_UTILS_WINDOWS_X86_64_ARTIFACTS_DIR: ${{ runner.temp }}/windows-x86-64-native
